trigger:
  branches:
    include:
    - dev
  paths:
    include:
    - Functions.Templates/Template-Manifest/manifest.json

pr: none

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  azureServiceConnection: 'your-service-connection-name'
  storageAccountName: 'your-storage-account-name'
  containerName: 'templates'
  manifestFilePath: 'Functions.Templates/Template-Manifest/manifest.json'

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
    - stage: Upload
      jobs:
      - job: UploadManifest
        displayName: Upload manifest.json
        steps:
        - task: AzureCLI@2
          displayName: 'Upload manifest.json to Azure Storage'
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              az storage blob upload `
                --account-name $(storageAccountName) `
                --container-name $(containerName) `
                --name manifest.json `
                --file $(manifestFilePath) `
                --auth-mode login
